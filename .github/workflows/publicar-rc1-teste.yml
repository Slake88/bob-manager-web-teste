name: Publicar RC1 TESTE (manual)

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Escrever PUBLICAR-BOB-TESTE para publicar os assets deste commit'
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-teste
  cancel-in-progress: false

jobs:
  preparar:
    if: github.repository == 'Slake88/bob-manager-web-teste' && github.ref == 'refs/heads/main' && inputs.confirmacao == 'PUBLICAR-BOB-TESTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validar e copiar apenas os 39 assets aprovados
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path.cwd()
          records = json.loads((root / '.github/rc1-files.json').read_text(encoding='utf-8-sig'))
          assert len(records) == 39
          names = [r['path'] for r in records]
          assert len(set(names)) == 39
          site = root / '_site'
          site.mkdir()
          for record in records:
              path = pathlib.PurePosixPath(record['path'])
              assert not path.is_absolute() and not set(path.parts) & {'..', '.git', '.github', '_site'}
              source = root / path
              assert source.is_file() and not source.is_symlink()
              data = source.read_bytes()
              assert len(data) == record['bytes']
              assert hashlib.sha256(data).hexdigest().upper() == record['sha256'].upper(), str(path)
              target = site / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          assert '<base href="/">' in (site / 'index.html').read_text()
          assert (root / 'CNAME').read_text().strip() == 'teste.bobmanager.blueonblack.pt'
          shutil.copyfile(root / 'CNAME', site / 'CNAME')
          (site / '.nojekyll').touch()
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 7

  publicar:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages TESTE
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
